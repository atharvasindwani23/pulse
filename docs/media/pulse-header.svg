    <radialGradient id="glow"><stop stop-color="#d8ee85" stop-opacity=".13"/><stop offset="1" stop-color="#d8ee85" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1279" height="339" rx="20" fill="none" stroke="#303b2b"/>
  <g fill="none" stroke="#23301f" stroke-width="1" opacity=".7"><path d="M760 0V340M840 0V340M920 0V340M1000 0V340M1080 0V340M1160 0V340M1240 0V340M720 60H1280M720 140H1280M720 220H1280M720 300H1280"/></g>
