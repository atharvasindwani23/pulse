<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Pulse — Stay in the conversation.</title>
  <desc id="desc">Live feedback on words, voice and expression. A lime waveform surrounded by four colored signal arcs on a dark background.</desc>
